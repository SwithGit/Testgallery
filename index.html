<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <title>엄청나게 멋진 갤러리</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico" />

  <style>
    :root {
      --bg: #0b0d12;
      --panel: rgba(20, 24, 33, 0.72);
      --panel-strong: rgba(16, 19, 27, 0.92);
      --line: rgba(255, 255, 255, 0.10);
      --text: #f5f7fb;
      --muted: #9aa3b2;
      --accent: #7c9cff;
      --accent-2: #9b7cff;
      --success: #7fe0a8;
      --danger: #ff7d8f;
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 15% 10%, rgba(124,156,255,.15), transparent 28%),
        radial-gradient(circle at 85% 15%, rgba(155,124,255,.12), transparent 24%),
        linear-gradient(180deg, #090b0f 0%, #0b0d12 55%, #0c0f15 100%);
      color: var(--text);
      font-family: Inter, Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.7), transparent 85%);
    }

    .page {
      min-height: 100vh;
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: 22px clamp(16px, 3vw, 42px) 34px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 58px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 32px rgba(124,156,255,.28);
      position: relative;
      flex: 0 0 auto;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 8px;
    }

    .brand-text { min-width: 0; }
    .brand-title {
      margin: 0;
      font-size: clamp(18px, 2vw, 24px);
      letter-spacing: -0.04em;
      font-weight: 760;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .02em;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--line);
      color: var(--text);
      background: rgba(255,255,255,.045);
      border-radius: 12px;
      height: 40px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition: .2s ease;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .btn:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,.075);
      border-color: rgba(255,255,255,.17);
    }

    .status-pill {
      height: 40px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      background: rgba(255,255,255,.03);
      font-size: 12px;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6f7785;
      box-shadow: 0 0 0 5px rgba(255,255,255,.03);
      transition: .25s ease;
    }
    .status-dot.ready { background: var(--success); box-shadow: 0 0 0 5px rgba(127,224,168,.09); }
    .status-dot.error { background: var(--danger); box-shadow: 0 0 0 5px rgba(255,125,143,.09); }

    .viewer-shell {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: grid;
      place-items: center;
    }

    #unity-container {
      position: relative;
      width: 100%;
      height: min(78vh, 920px);
      min-height: 520px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #05070a;
      box-shadow:
        0 35px 90px rgba(0,0,0,.46),
        inset 0 1px rgba(255,255,255,.03);
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #05070a;
      outline: none;
    }

    #unity-loading-bar {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 45%, rgba(124,156,255,.12), transparent 34%),
        rgba(5,7,10,.96);
    }

    .loader-card {
      width: min(420px, calc(100vw - 48px));
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel-strong);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 26px 72px rgba(0,0,0,.42);
    }

    .loader-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .loader-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 30px rgba(124,156,255,.24);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .loader-label {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .loader-caption {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    #unity-progress-bar-empty {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      overflow: hidden;
    }

    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 22px rgba(124,156,255,.32);
      transition: width .18s ease;
    }

    .loader-meta {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
    }

    #unity-warning {
      position: absolute;
      left: 14px;
      right: 14px;
      top: 14px;
      z-index: 20;
      pointer-events: none;
    }

    #unity-warning > div {
      width: fit-content;
      max-width: 720px;
      margin: 0 auto 8px;
      border-radius: 10px;
      padding: 10px 13px !important;
      color: white !important;
      background: rgba(24,27,34,.92) !important;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 12px 32px rgba(0,0,0,.22);
      font-size: 12px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .floating-controls {
      position: absolute;
      right: 14px;
      bottom: 14px;
      z-index: 8;
      display: flex;
      gap: 8px;
      opacity: .92;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 12px;
      font-size: 17px;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-size: 12px;
      padding: 2px 2px 0;
    }

    .footer strong { color: #d7ddea; font-weight: 650; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(.94); opacity: .78; }
    }

    @media (max-width: 760px) {
      .page { padding: 12px 12px 18px; gap: 12px; }
      .brand-subtitle, .status-pill { display: none; }
      .topbar { min-height: 48px; }
      .brand-mark { width: 34px; height: 34px; }
      .brand-title { font-size: 18px; }
      .btn { height: 36px; padding: 0 11px; }
      .btn .label { display: none; }
      #unity-container {
        height: calc(100svh - 94px);
        min-height: 420px;
        border-radius: 16px;
      }
      .footer { display: none; }
    }

    @media (max-width: 460px) {
      .actions { gap: 6px; }
      .btn { width: 36px; padding: 0; }
      .loader-card { padding: 22px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-text">
          <h1 class="brand-title">엄청나게 멋진 갤러리</h1>
          <div class="brand-subtitle">Interactive 3D Gallery · Unity WebGL</div>
        </div>
      </div>

      <div class="actions">
        <div class="status-pill" aria-live="polite">
          <span id="status-dot" class="status-dot"></span>
          <span id="status-text">불러오는 중</span>
        </div>
        <button class="btn" id="reload-button" type="button" title="다시 불러오기">
          ↻ <span class="label">새로고침</span>
        </button>
        <button class="btn" id="fullscreen-button-top" type="button" title="전체화면">
          ⛶ <span class="label">전체화면</span>
        </button>
      </div>
    </header>

    <section class="viewer-shell">
      <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>

        <div id="unity-loading-bar">
          <div class="loader-card">
            <div class="loader-top">
              <div class="loader-icon" aria-hidden="true"></div>
              <div>
                <div class="loader-label">갤러리를 준비하고 있어</div>
                <div class="loader-caption">3D 공간과 작품 데이터를 불러오는 중이야.</div>
              </div>
            </div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
            <div class="loader-meta">
              <span>Unity WebGL</span>
              <span id="progress-text">0%</span>
            </div>
          </div>
        </div>

        <div id="unity-warning"></div>

        <div class="floating-controls">
          <button class="btn icon-btn" id="fullscreen-button" type="button" aria-label="전체화면" title="전체화면">⛶</button>
        </div>
      </div>
    </section>

    <footer class="footer">
      <span>마우스와 키보드로 공간을 탐색해봐.</span>
      <span><strong>Test12345</strong> · v0.1.0</span>
    </footer>
  </main>

  <script>
    const canvas = document.querySelector('#unity-canvas');
    const container = document.querySelector('#unity-container');
    const loadingBar = document.querySelector('#unity-loading-bar');
    const progressBarFull = document.querySelector('#unity-progress-bar-full');
    const progressText = document.querySelector('#progress-text');
    const statusDot = document.querySelector('#status-dot');
    const statusText = document.querySelector('#status-text');
    const warningBanner = document.querySelector('#unity-warning');

    let unityInstanceRef = null;

    function unityShowBanner(msg, type) {
      const div = document.createElement('div');
      div.textContent = msg;
      warningBanner.appendChild(div);

      if (type === 'error') {
        div.style.borderColor = 'rgba(255,125,143,.45)';
      } else if (type === 'warning') {
        div.style.borderColor = 'rgba(255,206,99,.45)';
      }

      if (type !== 'error') {
        setTimeout(() => {
          if (div.parentNode) div.parentNode.removeChild(div);
        }, 5000);
      }
    }

    function setStatus(state, text) {
      statusDot.classList.remove('ready', 'error');
      if (state === 'ready') statusDot.classList.add('ready');
      if (state === 'error') statusDot.classList.add('error');
      statusText.textContent = text;
    }

    function updateResponsiveCanvas() {
      // Unity가 canvas DOM 크기와 렌더 타깃을 자동 동기화하도록 두고,
      // 실제 표시 크기는 CSS로 컨테이너에 맞춰 100% 유지한다.
      canvas.style.width = '100%';
      canvas.style.height = '100%';
    }

    updateResponsiveCanvas();
    window.addEventListener('resize', updateResponsiveCanvas);

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = 'unity-mobile';
      canvas.className = 'unity-mobile';
      // 모바일 성능이 부족하면 아래 값을 1로 고정할 수 있어.
      // config.devicePixelRatio = 1;
    }

    const buildUrl = 'Build';
    const loaderUrl = buildUrl + '/Build.loader.js';
    const config = {
      arguments: [],
      dataUrl: buildUrl + '/Build.data.br',
      frameworkUrl: buildUrl + '/Build.framework.js.br',
      codeUrl: buildUrl + '/Build.wasm.br',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'DefaultCompany',
      productName: 'Test12345',
      productVersion: '0.1.0',
      showBanner: unityShowBanner,
    };

    loadingBar.style.display = 'flex';
    setStatus('loading', '불러오는 중');

    const script = document.createElement('script');
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        const value = Math.round(progress * 100);
        progressBarFull.style.width = value + '%';
        progressText.textContent = value + '%';
      }).then((unityInstance) => {
        unityInstanceRef = unityInstance;
        loadingBar.style.display = 'none';
        setStatus('ready', '준비됨');
      }).catch((message) => {
        setStatus('error', '오류');
        loadingBar.style.display = 'none';
        unityShowBanner(message, 'error');
      });
    };

    script.onerror = () => {
      setStatus('error', '로더 오류');
      loadingBar.style.display = 'none';
      unityShowBanner('Unity 로더 파일을 불러오지 못했어. Build 폴더 경로를 확인해줘.', 'error');
    };

    document.body.appendChild(script);

    function enterFullscreen() {
      if (unityInstanceRef) {
        unityInstanceRef.SetFullscreen(1);
      } else if (container.requestFullscreen) {
        container.requestFullscreen();
      }
    }

    document.querySelector('#fullscreen-button').addEventListener('click', enterFullscreen);
    document.querySelector('#fullscreen-button-top').addEventListener('click', enterFullscreen);
    document.querySelector('#reload-button').addEventListener('click', () => location.reload());
  </script>
</body>
</html>
